<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>하마 대전쟁 - Hippo Wars</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            overflow: hidden;
            touch-action: manipulation;
        }

        #game-wrapper {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1a1a2e;
        }

        #game-container {
            width: 100%;
            max-width: 900px;
            height: 100%;
            max-height: 600px;
            position: relative;
            overflow: hidden;
        }

        /* ===== TITLE SCREEN ===== */
        #title-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #ff9a56 0%, #ff6b35 50%, #c44536 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .title-logo {
            font-size: 3.5em;
            font-weight: 900;
            color: #fff;
            text-shadow:
                4px 4px 0 #c44536,
                -2px -2px 0 #ffcc00,
                0 0 20px rgba(255,255,255,0.5);
            margin-bottom: 10px;
            animation: titleBounce 1s ease infinite;
        }

        @keyframes titleBounce {
            0%, 100% { transform: scale(1) rotate(-2deg); }
            50% { transform: scale(1.05) rotate(2deg); }
        }

        .title-sub {
            font-size: 1.5em;
            color: #ffeb3b;
            text-shadow: 2px 2px 0 #c44536;
            margin-bottom: 30px;
        }

        .title-hippo {
            font-size: 8em;
            animation: hippoWalk 0.5s ease infinite;
            filter: drop-shadow(4px 4px 0 rgba(0,0,0,0.3));
        }

        @keyframes hippoWalk {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
        }

        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 30px;
        }

        .menu-btn {
            padding: 15px 60px;
            font-size: 1.4em;
            font-weight: bold;
            border: 4px solid #000;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.1s;
            text-shadow: 1px 1px 0 rgba(0,0,0,0.3);
        }

        .menu-btn:active {
            transform: scale(0.95);
        }

        .menu-btn.play {
            background: linear-gradient(180deg, #4CAF50, #2E7D32);
            color: white;
            box-shadow: 0 6px 0 #1B5E20;
        }

        .menu-btn.upgrade {
            background: linear-gradient(180deg, #2196F3, #1565C0);
            color: white;
            box-shadow: 0 6px 0 #0D47A1;
        }

        /* ===== CHAPTER SELECT ===== */
        #chapter-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #87CEEB 0%, #5BA3D9 100%);
            display: none;
            flex-direction: column;
            z-index: 90;
        }

        .chapter-header {
            background: linear-gradient(180deg, #ff6b35, #c44536);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid #000;
        }

        .chapter-header h2 {
            color: #fff;
            text-shadow: 2px 2px 0 #000;
        }

        .header-coins {
            background: #000;
            color: #ffeb3b;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1.2em;
        }

        .back-btn {
            background: linear-gradient(180deg, #666, #333);
            color: white;
            border: 3px solid #000;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        .world-map {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            align-content: flex-start;
        }

        .stage-node {
            width: 100px;
            height: 80px;
            background: linear-gradient(180deg, #fff, #e0e0e0);
            border: 4px solid #333;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.1s;
            position: relative;
        }

        .stage-node:active {
            transform: scale(0.95);
        }

        .stage-node.locked {
            background: linear-gradient(180deg, #888, #555);
            opacity: 0.6;
            cursor: not-allowed;
        }

        .stage-node.cleared {
            background: linear-gradient(180deg, #4CAF50, #2E7D32);
        }

        .stage-node.cleared::after {
            content: '⭐';
            position: absolute;
            top: -10px;
            right: -10px;
            font-size: 1.5em;
        }

        .stage-num {
            font-size: 0.8em;
            color: #666;
            font-weight: bold;
        }

        .stage-name {
            font-size: 1em;
            font-weight: bold;
            color: #333;
        }

        .stage-node.cleared .stage-num,
        .stage-node.cleared .stage-name {
            color: #fff;
        }

        /* ===== BATTLE SCREEN ===== */
        #battle-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            z-index: 80;
        }

        /* Top Info Bar */
        .battle-top-bar {
            height: 50px;
            background: linear-gradient(180deg, #333, #111);
            display: flex;
            align-items: center;
            padding: 0 10px;
            gap: 15px;
            border-bottom: 3px solid #000;
        }

        .stage-info {
            color: #fff;
            font-weight: bold;
            font-size: 0.9em;
        }

        .money-display {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #ffeb3b;
            font-weight: bold;
            font-size: 1.2em;
        }

        .battle-menu-btn {
            margin-left: auto;
            background: linear-gradient(180deg, #e74c3c, #c0392b);
            color: white;
            border: 2px solid #000;
            padding: 5px 15px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Battle Field */
        .battle-field {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        #battle-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Bottom Control Panel - 냥코 스타일 */
        .control-panel {
            height: 180px;
            background: linear-gradient(180deg, #4a4a4a, #2a2a2a);
            border-top: 4px solid #000;
            display: flex;
            flex-direction: column;
        }

        /* Worker & Cannon Row */
        .top-controls {
            height: 50px;
            display: flex;
            align-items: center;
            padding: 5px 10px;
            gap: 10px;
            background: linear-gradient(180deg, #555, #333);
            border-bottom: 2px solid #000;
        }

        /* Worker Level Button */
        .worker-btn {
            width: 80px;
            height: 40px;
            background: linear-gradient(180deg, #f39c12, #d68910);
            border: 3px solid #000;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.7em;
            font-weight: bold;
            color: #fff;
            text-shadow: 1px 1px 0 #000;
        }

        .worker-btn:active {
            transform: scale(0.95);
        }

        .worker-btn .level {
            font-size: 1.2em;
        }

        /* Money Progress Bar */
        .money-progress-container {
            flex: 1;
            height: 30px;
            background: #222;
            border: 3px solid #000;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
        }

        .money-progress-bar {
            height: 100%;
            background: linear-gradient(180deg, #f1c40f, #f39c12);
            width: 0%;
            transition: width 0.05s linear;
        }

        .money-progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-weight: bold;
            text-shadow: 1px 1px 0 #000;
        }

        /* Cannon Button */
        .cannon-btn {
            width: 80px;
            height: 40px;
            background: linear-gradient(180deg, #666, #444);
            border: 3px solid #000;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            position: relative;
            overflow: hidden;
        }

        .cannon-btn.ready {
            background: linear-gradient(180deg, #e74c3c, #c0392b);
            animation: cannonReady 0.5s ease infinite;
        }

        @keyframes cannonReady {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .cannon-charge {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0%;
            background: rgba(231, 76, 60, 0.5);
            transition: height 0.1s linear;
        }

        /* Unit Slots */
        .unit-slots {
            flex: 1;
            display: flex;
            padding: 10px;
            gap: 5px;
            justify-content: center;
            align-items: center;
        }

        .unit-slot {
            width: 70px;
            height: 70px;
            background: linear-gradient(180deg, #666, #444);
            border: 3px solid #000;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: transform 0.1s;
        }

        .unit-slot:active:not(.disabled):not(.cooldown) {
            transform: scale(0.9);
        }

        .unit-slot.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .unit-slot.cooldown::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            border-radius: 7px;
        }

        .unit-slot .unit-icon {
            font-size: 2em;
        }

        .unit-slot .unit-cost {
            font-size: 0.7em;
            color: #ffeb3b;
            font-weight: bold;
            text-shadow: 1px 1px 0 #000;
        }

        .unit-slot .cooldown-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            border-radius: 7px;
            display: none;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.5em;
            font-weight: bold;
        }

        .unit-slot.cooldown .cooldown-overlay {
            display: flex;
        }

        .unit-row {
            display: flex;
            gap: 5px;
        }

        /* ===== UPGRADE SCREEN ===== */
        #upgrade-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #1a237e, #0d1442);
            display: none;
            flex-direction: column;
            z-index: 90;
        }

        .upgrade-header {
            background: linear-gradient(180deg, #3949ab, #1a237e);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid #000;
        }

        .upgrade-header h2 {
            color: #fff;
            text-shadow: 2px 2px 0 #000;
        }

        .upgrade-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .upgrade-section {
            background: rgba(255,255,255,0.1);
            border: 3px solid #5c6bc0;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .upgrade-section h3 {
            color: #ffeb3b;
            margin-bottom: 15px;
            text-shadow: 1px 1px 0 #000;
        }

        .upgrade-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .upgrade-item {
            background: linear-gradient(180deg, #5c6bc0, #3949ab);
            border: 3px solid #000;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            color: #fff;
        }

        .upgrade-item .icon {
            font-size: 2em;
            margin-bottom: 5px;
        }

        .upgrade-item .name {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .upgrade-item .level {
            color: #ffeb3b;
            margin-bottom: 5px;
        }

        .upgrade-item .cost-btn {
            background: linear-gradient(180deg, #f39c12, #d68910);
            border: 2px solid #000;
            color: #fff;
            padding: 5px 15px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
        }

        .upgrade-item .cost-btn:disabled {
            background: #666;
            cursor: not-allowed;
        }

        /* ===== RESULT OVERLAY ===== */
        .result-overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }

        .result-box {
            background: linear-gradient(180deg, #fff, #e0e0e0);
            border: 6px solid #000;
            border-radius: 20px;
            padding: 30px 50px;
            text-align: center;
        }

        .result-box.victory {
            border-color: #4CAF50;
        }

        .result-box.defeat {
            border-color: #e74c3c;
        }

        .result-title {
            font-size: 2.5em;
            font-weight: 900;
            margin-bottom: 10px;
        }

        .result-box.victory .result-title {
            color: #4CAF50;
        }

        .result-box.defeat .result-title {
            color: #e74c3c;
        }

        .result-reward {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 20px;
        }

        .result-btn {
            background: linear-gradient(180deg, #4CAF50, #2E7D32);
            color: white;
            border: 3px solid #000;
            padding: 10px 40px;
            border-radius: 25px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
        }

        /* ===== LOADING ===== */
        .loading-text {
            color: #fff;
            font-size: 1.5em;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>

            <!-- Result Overlay -->

                    <button class="result-btn" onclick="closeResult()">확인</button>

            </div>
        </div>
    </div>

            { id: 6, name: "폭격하마", icon: "💣", cost: 400, hp: 300, atk: 150, speed: 2, range: 250, cooldown: 6, attackSpeed: 3.0, kb: 3, desc: "범위 공격" },
            { id: 7, name: "힐러양", icon: "🐑", cost: 250, hp: 250, atk: 0, speed: 2, range: 150, cooldown: 10, attackSpeed: 3.0, kb: 3, desc: "아군 회복", special: "heal" },
            { id: 8, name: "용감한사자", icon: "🦁", cost: 800, hp: 1000, atk: 150, speed: 2.5, range: 40, cooldown: 12, attackSpeed: 1.2, kb: 2, desc: "강한 전사" },

        ];

        // 적 유닛
        const enemyData = [
            { id: "dog", name: "개", icon: "🐕", hp: 100, atk: 20, speed: 3, range: 25, attackSpeed: 1.0, kb: 3 },
            { id: "cat", name: "고양이", icon: "🐈", hp: 80, atk: 30, speed: 4, range: 20, attackSpeed: 0.8, kb: 3 },
            { id: "wolf", name: "늑대", icon: "🐺", hp: 200, atk: 40, speed: 2.5, range: 30, attackSpeed: 1.2, kb: 2 },
            { id: "bear", name: "곰", icon: "🐻", hp: 500, atk: 60, speed: 1.5, range: 35, attackSpeed: 1.5, kb: 1 },
            { id: "lion", name: "사자", icon: "🦁", hp: 400, atk: 80, speed: 2, range: 40, attackSpeed: 1.0, kb: 2 },
            { id: "tiger", name: "호랑이", icon: "🐅", hp: 450, atk: 90, speed: 2.5, range: 35, attackSpeed: 0.9, kb: 2 },
            { id: "gorilla", name: "고릴라", icon: "🦍", hp: 800, atk: 100, speed: 1, range: 45, attackSpeed: 2.0, kb: 1 },
            { id: "rhino", name: "코뿔소", icon: "🦏", hp: 1000, atk: 120, speed: 2, range: 30, attackSpeed: 2.0, kb: 1 },
            { id: "dragon", name: "드래곤", icon: "🐉", hp: 2000, atk: 200, speed: 0.8, range: 200, attackSpeed: 3.0, kb: 1 }
        ];

        // ===== GAME STATE =====
        let gameData = {
            coins: 1000,
            clearedStages: [],
            unitLevels: {},
            workerLevel: 1,
            cannonLevel: 1
        };

        // Load saved data
        function loadGame() {
            const saved = localStorage.getItem('hippoWarsData');
            if (saved) {
                gameData = { ...gameData, ...JSON.parse(saved) };
            }
        }

        function saveGame() {
            localStorage.setItem('hippoWarsData', JSON.stringify(gameData));
        }

        // ===== BATTLE STATE =====
        let battle = null;
        let canvas, ctx;
        let animationId;

        class Battle {
            constructor(stageNum) {
                this.stageNum = stageNum;
                this.chapter = chapters.find(c => c.num === stageNum);
                this.difficulty = 1 + (stageNum - 1) * 0.12;

                // Worker level affects money gain
                this.workerLevel = 1;
                this.maxWorkerLevel = 8;
                this.workerCosts = [0, 100, 200, 400, 600, 800, 1000, 1500];
                this.moneyRates = [50, 70, 90, 120, 150, 200, 250, 300];

                this.money = 500;
                this.maxMoney = 9999;
                this.moneyProgress = 0;

                // Cannon
                this.cannonCharge = 0;
                this.cannonMaxCharge = 100;
                this.cannonReady = false;
                this.cannonDamage = 500 + gameData.cannonLevel * 100;

                // Bases
                const baseHPBonus = (gameData.unitLevels['baseHP'] || 0) * 200;
                this.playerBaseHP = 2000 + baseHPBonus;
                this.playerBaseMaxHP = this.playerBaseHP;
                this.enemyBaseHP = Math.floor((1500 + stageNum * 200) * this.difficulty);
                this.enemyBaseMaxHP = this.enemyBaseHP;

                // Units
                this.playerUnits = [];
                this.enemyUnits = [];

                // Cooldowns
                this.cooldowns = {};
                unitData.forEach(u => this.cooldowns[u.id] = 0);

                // Camera
                this.cameraX = 0;
                this.fieldWidth = 2000;

                // Enemy spawn
                this.enemySpawnTimer = 0;
                this.enemySpawnRate = Math.max(2, 5 - stageNum * 0.05);
                this.maxEnemyType = Math.min(Math.floor(stageNum / 5), enemyData.length - 1);

                // Time
                this.lastTime = Date.now();
                this.running = true;
            }

            update() {
                if (!this.running) return;

                const now = Date.now();
                const dt = (now - this.lastTime) / 1000;
                this.lastTime = now;

                // Money generation
                const moneyRate = this.moneyRates[this.workerLevel - 1];
                this.moneyProgress += dt * 50;
                if (this.moneyProgress >= 100) {
                    this.money = Math.min(this.money + moneyRate, this.maxMoney);
                    this.moneyProgress = 0;
                }

                // Cannon charge
                if (!this.cannonReady) {
                    this.cannonCharge += dt * 10;
                    if (this.cannonCharge >= this.cannonMaxCharge) {
                        this.cannonCharge = this.cannonMaxCharge;
                        this.cannonReady = true;
                    }
                }

                // Update cooldowns
                unitData.forEach(u => {
                    if (this.cooldowns[u.id] > 0) {
                        this.cooldowns[u.id] = Math.max(0, this.cooldowns[u.id] - dt);
                    }
                });

                // Spawn enemies
                this.enemySpawnTimer += dt;
                if (this.enemySpawnTimer >= this.enemySpawnRate) {
                    this.spawnEnemy();
                    this.enemySpawnTimer = 0;
                    // Vary spawn rate
                    this.enemySpawnRate = Math.max(1.5, 4 - this.stageNum * 0.03 + Math.random() * 2);
                }

                // Update units
                this.updateUnits(dt);

                // Update camera
                this.updateCamera();

                // Check win/lose
                if (this.enemyBaseHP <= 0) {
                    this.victory();
                } else if (this.playerBaseHP <= 0) {
                    this.defeat();
                }
            }

            spawnPlayerUnit(unitId) {
                const unitInfo = unitData[unitId];
                if (!unitInfo) return false;
                if (this.money < unitInfo.cost) return false;
                if (this.cooldowns[unitId] > 0) return false;

                this.money -= unitInfo.cost;
                this.cooldowns[unitId] = unitInfo.cooldown;

                // Apply upgrades
                const levelBonus = (gameData.unitLevels[unitId] || 0);
                const hpBonus = 1 + levelBonus * 0.1;
                const atkBonus = 1 + levelBonus * 0.1;

                const unit = {
                    ...unitInfo,
                    hp: Math.floor(unitInfo.hp * hpBonus),
                    maxHP: Math.floor(unitInfo.hp * hpBonus),
                    atk: Math.floor(unitInfo.atk * atkBonus),
                    x: 100,
                    isPlayer: true,
                    attackTimer: 0,
                    knockback: 0,
                    kbCount: unitInfo.kb
                };

                this.playerUnits.push(unit);
                return true;
            }

            spawnEnemy() {
                const typeIndex = Math.floor(Math.random() * (this.maxEnemyType + 1));
                const enemyInfo = enemyData[typeIndex];

                const unit = {
                    ...enemyInfo,
                    hp: Math.floor(enemyInfo.hp * this.difficulty),
                    maxHP: Math.floor(enemyInfo.hp * this.difficulty),
                    atk: Math.floor(enemyInfo.atk * this.difficulty),
                    x: this.fieldWidth - 100,
                    isPlayer: false,
                    attackTimer: 0,
                    knockback: 0,
                    kbCount: enemyInfo.kb
                };

                this.enemyUnits.push(unit);
            }

            updateUnits(dt) {
                // Update all units
                const allUnits = [...this.playerUnits, ...this.enemyUnits];

                // Player units
                for (let i = this.playerUnits.length - 1; i >= 0; i--) {
                    const unit = this.playerUnits[i];
                    if (unit.hp <= 0) {
                        this.playerUnits.splice(i, 1);
                        continue;
                    }

                    // Knockback
                    if (unit.knockback > 0) {
                        unit.x -= 100 * dt;
                        unit.knockback -= dt;
                        continue;
                    }

                    // Find target
                    let target = null;
                    let minDist = unit.range;

                    for (const enemy of this.enemyUnits) {
                        const dist = enemy.x - unit.x;
                        if (dist > 0 && dist <= minDist) {
                            minDist = dist;
                            target = enemy;
                        }
                    }

                    // Check enemy base
                    const baseDistE = (this.fieldWidth - 80) - unit.x;
                    if (baseDistE <= unit.range && baseDistE > 0) {
                        // Attack base
                        unit.attackTimer += dt;
                        if (unit.attackTimer >= unit.attackSpeed) {
                            this.enemyBaseHP -= unit.atk;
                            unit.attackTimer = 0;
                        }
                    } else if (target) {
                        // Attack enemy
                        unit.attackTimer += dt;
                        if (unit.attackTimer >= unit.attackSpeed) {
                            // Special abilities
                            if (unit.special === 'heal') {
                                // Heal nearby allies
                                for (const ally of this.playerUnits) {
                                    if (Math.abs(ally.x - unit.x) < unit.range) {
                                        ally.hp = Math.min(ally.maxHP, ally.hp + 50);
                                    }
                                }
                            } else {
                                target.hp -= unit.atk;
                                if (target.hp > 0) {
                                    target.kbCount--;
                                    if (target.kbCount <= 0) {
                                        target.knockback = 0.3;
                                        target.kbCount = enemyData.find(e => e.id === target.id)?.kb || 3;
                                    }
                                }
                            }
                            unit.attackTimer = 0;
                        }
                    } else {
                        // Move
                        unit.x += unit.speed * 30 * dt;
                        unit.attackTimer = 0;
                    }
                }

                // Enemy units
                for (let i = this.enemyUnits.length - 1; i >= 0; i--) {
                    const unit = this.enemyUnits[i];
                    if (unit.hp <= 0) {
                        this.enemyUnits.splice(i, 1);
                        continue;
                    }

                    // Knockback
                    if (unit.knockback > 0) {
                        unit.x += 100 * dt;
                        unit.knockback -= dt;
                        continue;
                    }

                    // Find target
                    let target = null;
                    let minDist = unit.range;

                    for (const player of this.playerUnits) {
                        const dist = unit.x - player.x;
                        if (dist > 0 && dist <= minDist) {
                            minDist = dist;
                            target = player;
                        }
                    }

                    // Check player base
                    const baseDistP = unit.x - 80;
                    if (baseDistP <= unit.range && baseDistP > 0) {
                        // Attack base
                        unit.attackTimer += dt;
                        if (unit.attackTimer >= unit.attackSpeed) {
                            this.playerBaseHP -= unit.atk;
                            unit.attackTimer = 0;
                        }
                    } else if (target) {
                        // Attack player
                        unit.attackTimer += dt;
                        if (unit.attackTimer >= unit.attackSpeed) {
                            target.hp -= unit.atk;
                            if (target.hp > 0) {
                                target.kbCount--;
                                if (target.kbCount <= 0) {
                                    target.knockback = 0.3;
                                    target.kbCount = unitData[target.id]?.kb || 3;
                                }
                            }
                            unit.attackTimer = 0;
                        }
                    } else {
                        // Move
                        unit.x -= unit.speed * 30 * dt;
                        unit.attackTimer = 0;
                    }
                }
            }

            updateCamera() {
                // Follow frontmost player unit
                let targetX = 0;
                if (this.playerUnits.length > 0) {
                    const frontUnit = this.playerUnits.reduce((a, b) => a.x > b.x ? a : b);
                    targetX = frontUnit.x - canvas.width / 3;
                }
                targetX = Math.max(0, Math.min(targetX, this.fieldWidth - canvas.width));
                this.cameraX += (targetX - this.cameraX) * 0.05;
            }

            fireCannon() {
                if (!this.cannonReady) return;
                this.cannonReady = false;
                this.cannonCharge = 0;

                // Damage all enemies
                for (const enemy of this.enemyUnits) {
                    enemy.hp -= this.cannonDamage;
                    enemy.knockback = 0.5;
                }
                // Damage enemy base
                this.enemyBaseHP -= this.cannonDamage;
            }

            upgradeWorker() {
                if (this.workerLevel >= this.maxWorkerLevel) return;
                const cost = this.workerCosts[this.workerLevel];
                if (this.money >= cost) {
                    this.money -= cost;
                    this.workerLevel++;
                }
            }

            victory() {
                this.running = false;
                const reward = 100 + this.stageNum * 30;
                gameData.coins += reward;
                if (!gameData.clearedStages.includes(this.stageNum)) {
                    gameData.clearedStages.push(this.stageNum);
                }
                saveGame();
                showResult(true, reward);
            }

            defeat() {
                this.running = false;
                showResult(false, 0);
            }

            render() {
                // Clear
                ctx.fillStyle = '#87CEEB';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Ground
                ctx.fillStyle = '#228B22';
                ctx.fillRect(0, canvas.height * 0.65, canvas.width, canvas.height * 0.35);

                // Grass line
                ctx.fillStyle = '#1a5c1a';
                ctx.fillRect(0, canvas.height * 0.65, canvas.width, 5);

                const groundY = canvas.height * 0.65;

                // Player base
                const playerBaseX = 50 - this.cameraX;
                if (playerBaseX > -100 && playerBaseX < canvas.width) {
                    // Base building
                    ctx.fillStyle = '#8B4513';
                    ctx.fillRect(playerBaseX, groundY - 80, 60, 80);
                    ctx.fillStyle = '#A0522D';
                    ctx.beginPath();
                    ctx.moveTo(playerBaseX - 10, groundY - 80);
                    ctx.lineTo(playerBaseX + 30, groundY - 120);
                    ctx.lineTo(playerBaseX + 70, groundY - 80);
                    ctx.fill();
                    // Flag
                    ctx.fillStyle = '#ff6b6b';
                    ctx.fillRect(playerBaseX + 25, groundY - 150, 30, 20);
                    ctx.fillStyle = '#333';
                    ctx.fillRect(playerBaseX + 23, groundY - 150, 3, 50);
                    // HP bar
                    this.drawHPBar(playerBaseX, groundY - 160, 60, 8, this.playerBaseHP, this.playerBaseMaxHP, '#4CAF50');
                }

                // Enemy base
                const enemyBaseX = this.fieldWidth - 100 - this.cameraX;
                if (enemyBaseX > -100 && enemyBaseX < canvas.width + 100) {
                    ctx.fillStyle = '#4a4a4a';
                    ctx.fillRect(enemyBaseX, groundY - 80, 60, 80);
                    ctx.fillStyle = '#666';
                    ctx.beginPath();
                    ctx.moveTo(enemyBaseX - 10, groundY - 80);
                    ctx.lineTo(enemyBaseX + 30, groundY - 120);
                    ctx.lineTo(enemyBaseX + 70, groundY - 80);
                    ctx.fill();
                    ctx.fillStyle = '#9b59b6';
                    ctx.fillRect(enemyBaseX + 25, groundY - 150, 30, 20);
                    ctx.fillStyle = '#333';
                    ctx.fillRect(enemyBaseX + 23, groundY - 150, 3, 50);
                    this.drawHPBar(enemyBaseX, groundY - 160, 60, 8, this.enemyBaseHP, this.enemyBaseMaxHP, '#9b59b6');
                }

                // Draw units
                const drawUnit = (unit) => {
                    const screenX = unit.x - this.cameraX;
                    if (screenX < -50 || screenX > canvas.width + 50) return;

                    const y = groundY - 30;

                    // Shadow
                    ctx.fillStyle = 'rgba(0,0,0,0.3)';
                    ctx.beginPath();
                    ctx.ellipse(screenX, groundY - 5, 15, 5, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // Unit emoji
                    ctx.font = '35px Arial';
                    ctx.textAlign = 'center';
                    ctx.save();
                    if (!unit.isPlayer) {
                        ctx.scale(-1, 1);
                        ctx.fillText(unit.icon, -screenX, y);
                    } else {
                        ctx.fillText(unit.icon, screenX, y);
                    }
                    ctx.restore();

                    // HP bar
                    this.drawHPBar(screenX - 20, y - 45, 40, 5, unit.hp, unit.maxHP, unit.isPlayer ? '#4CAF50' : '#e74c3c');
                };

                // Draw player units
                this.playerUnits.forEach(drawUnit);
                // Draw enemy units
                this.enemyUnits.forEach(drawUnit);
            }

            drawHPBar(x, y, w, h, hp, maxHP, color) {
                ctx.fillStyle = '#333';
                ctx.fillRect(x, y, w, h);
                ctx.fillStyle = color;
                ctx.fillRect(x + 1, y + 1, (w - 2) * (hp / maxHP), h - 2);
            }
        }

        // ===== SCREEN MANAGEMENT =====
        function showTitleScreen() {
            document.getElementById('title-screen').style.display = 'flex';
            document.getElementById('chapter-screen').style.display = 'none';
            document.getElementById('battle-screen').style.display = 'none';
            document.getElementById('upgrade-screen').style.display = 'none';
            stopBattle();
        }

        function showChapterScreen() {
            document.getElementById('title-screen').style.display = 'none';
            document.getElementById('chapter-screen').style.display = 'flex';
            document.getElementById('battle-screen').style.display = 'none';
            document.getElementById('upgrade-screen').style.display = 'none';
            document.getElementById('chapter-coins').textContent = gameData.coins;
            renderChapters();
        }

        function showUpgradeScreen() {
            document.getElementById('title-screen').style.display = 'none';
            document.getElementById('chapter-screen').style.display = 'none';
            document.getElementById('battle-screen').style.display = 'none';
            document.getElementById('upgrade-screen').style.display = 'flex';
            document.getElementById('upgrade-coins').textContent = gameData.coins;
            renderUpgrades();
        }

        function showBattleScreen(stageNum) {
            document.getElementById('title-screen').style.display = 'none';
            document.getElementById('chapter-screen').style.display = 'none';
            document.getElementById('battle-screen').style.display = 'flex';
            document.getElementById('upgrade-screen').style.display = 'none';
            startBattle(stageNum);
        }

        function renderChapters() {
            const map = document.getElementById('world-map');
            map.innerHTML = '';

            chapters.forEach((chapter, index) => {
                const isUnlocked = index === 0 || gameData.clearedStages.includes(index);
                const isCleared = gameData.clearedStages.includes(chapter.num);

                const node = document.createElement('div');
                node.className = `stage-node ${isCleared ? 'cleared' : ''} ${!isUnlocked ? 'locked' : ''}`;
                node.innerHTML = `
                    <div class="stage-num">${chapter.num}장</div>
                    <div class="stage-name">${chapter.name}</div>
                `;

                if (isUnlocked) {
                    node.onclick = () => showBattleScreen(chapter.num);
                }

                map.appendChild(node);
            });
        }

        function renderUpgrades() {
            const content = document.getElementById('upgrade-content');
            content.innerHTML = '';

            // Unit upgrades
            const unitSection = document.createElement('div');
            unitSection.className = 'upgrade-section';
            unitSection.innerHTML = '<h3>🦛 유닛 강화</h3><div class="upgrade-grid" id="unit-upgrades"></div>';
            content.appendChild(unitSection);

            const unitGrid = unitSection.querySelector('#unit-upgrades');
            unitData.forEach(unit => {
                const level = gameData.unitLevels[unit.id] || 0;
                const cost = 100 + level * 50;
                const maxLevel = 20;

                const item = document.createElement('div');
                item.className = 'upgrade-item';
                item.innerHTML = `
                    <div class="icon">${unit.icon}</div>
                    <div class="name">${unit.name}</div>
                    <div class="level">Lv.${level}${level >= maxLevel ? ' (MAX)' : ''}</div>
                    <button class="cost-btn" ${level >= maxLevel || gameData.coins < cost ? 'disabled' : ''}
                            onclick="upgradeUnit(${unit.id}, ${cost})">
                        💰 ${cost}
                    </button>
                `;
                unitGrid.appendChild(item);
            });

            // Base upgrades
            const baseSection = document.createElement('div');
            baseSection.className = 'upgrade-section';
            baseSection.innerHTML = '<h3>🏰 기지 & 특수</h3><div class="upgrade-grid" id="base-upgrades"></div>';
            content.appendChild(baseSection);

            const baseGrid = baseSection.querySelector('#base-upgrades');

            // Base HP
            const baseLevel = gameData.unitLevels['baseHP'] || 0;
            const baseCost = 200 + baseLevel * 100;
            baseGrid.innerHTML += `
                <div class="upgrade-item">
                    <div class="icon">🏰</div>
                    <div class="name">기지 체력</div>
                    <div class="level">Lv.${baseLevel}</div>
                    <button class="cost-btn" ${gameData.coins < baseCost ? 'disabled' : ''}
                            onclick="upgradeUnit('baseHP', ${baseCost})">💰 ${baseCost}</button>
                </div>
            `;

            // Cannon
            const cannonCost = 300 + gameData.cannonLevel * 150;
            baseGrid.innerHTML += `
                <div class="upgrade-item">
                    <div class="icon">💥</div>
                    <div class="name">하마포</div>
                    <div class="level">Lv.${gameData.cannonLevel}</div>
                    <button class="cost-btn" ${gameData.coins < cannonCost ? 'disabled' : ''}
                            onclick="upgradeCannon(${cannonCost})">💰 ${cannonCost}</button>
                </div>
            `;
        }

        function upgradeUnit(unitId, cost) {
            if (gameData.coins >= cost) {
                gameData.coins -= cost;
                gameData.unitLevels[unitId] = (gameData.unitLevels[unitId] || 0) + 1;
                saveGame();
                document.getElementById('upgrade-coins').textContent = gameData.coins;
                renderUpgrades();
            }
        }

        function upgradeCannon(cost) {
            if (gameData.coins >= cost) {
                gameData.coins -= cost;
                gameData.cannonLevel++;
                saveGame();
                document.getElementById('upgrade-coins').textContent = gameData.coins;
                renderUpgrades();
            }
        }

        // ===== BATTLE =====
        function startBattle(stageNum) {
            const chapter = chapters.find(c => c.num === stageNum);
            document.getElementById('stage-info').textContent = `${chapter.num}장 - ${chapter.name}`;

            // Setup canvas
            canvas = document.getElementById('battle-canvas');
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            ctx = canvas.getContext('2d');

            // Create battle
            battle = new Battle(stageNum);

            // Render unit slots
            renderUnitSlots();

            // Start game loop
            gameLoop();
        }

        function stopBattle() {
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            battle = null;
        }

        function retreatBattle() {
            stopBattle();
            showChapterScreen();
        }

        function renderUnitSlots() {
            const slots = document.getElementById('unit-slots');
            slots.innerHTML = '';

            unitData.forEach((unit, index) => {
                const slot = document.createElement('div');
                slot.className = 'unit-slot';
                slot.id = `unit-slot-${index}`;
                slot.innerHTML = `
                    <span class="unit-icon">${unit.icon}</span>
                    <span class="unit-cost">$${unit.cost}</span>
                    <div class="cooldown-overlay"></div>
                `;
                slot.onclick = () => spawnUnit(index);
                slots.appendChild(slot);
            });
        }

        function spawnUnit(unitId) {
            if (battle && battle.spawnPlayerUnit(unitId)) {
                updateUI();
            }
        }

        function upgradeWorker() {
            if (battle) {
                battle.upgradeWorker();
                updateUI();
            }
        }

        function fireCannon() {
            if (battle) {
                battle.fireCannon();
                updateUI();
            }
        }

        function updateUI() {
            if (!battle) return;

            document.getElementById('battle-money').textContent = Math.floor(battle.money);
            document.getElementById('money-progress').style.width = battle.moneyProgress + '%';
            document.getElementById('money-text').textContent = `+${battle.moneyRates[battle.workerLevel - 1]}`;
            document.getElementById('worker-level').textContent = `Lv.${battle.workerLevel}`;

            // Cannon
            const cannonBtn = document.getElementById('cannon-btn');
            const cannonCharge = document.getElementById('cannon-charge');
            cannonCharge.style.height = battle.cannonCharge + '%';
            cannonBtn.classList.toggle('ready', battle.cannonReady);

            // Worker button
            const workerBtn = document.getElementById('worker-btn');
            if (battle.workerLevel >= battle.maxWorkerLevel) {
                workerBtn.disabled = true;
            } else {
                workerBtn.disabled = battle.money < battle.workerCosts[battle.workerLevel];
            }

            // Unit slots
            unitData.forEach((unit, index) => {
                const slot = document.getElementById(`unit-slot-${index}`);
                if (!slot) return;

                const cooldown = battle.cooldowns[index];
                const canAfford = battle.money >= unit.cost;

                slot.classList.toggle('disabled', !canAfford && cooldown <= 0);
                slot.classList.toggle('cooldown', cooldown > 0);

                const overlay = slot.querySelector('.cooldown-overlay');
                if (cooldown > 0) {
                    overlay.textContent = Math.ceil(cooldown);
                }
            });
        }

        function gameLoop() {
            if (!battle || !battle.running) return;

            battle.update();
            battle.render();
            updateUI();

            animationId = requestAnimationFrame(gameLoop);
        }

        function showResult(isVictory, reward) {
            const overlay = document.getElementById('result-overlay');
            const box = document.getElementById('result-box');
            const title = document.getElementById('result-title');
            const rewardText = document.getElementById('result-reward');

            box.className = `result-box ${isVictory ? 'victory' : 'defeat'}`;
            title.textContent = isVictory ? '🎉 승리! 🎉' : '💀 패배..';
            rewardText.textContent = isVictory ? `💰 ${reward} 획득!` : '다시 도전하세요!';

            overlay.style.display = 'flex';
        }

        function closeResult() {
            document.getElementById('result-overlay').style.display = 'none';
            showChapterScreen();
        }

        // ===== INIT =====
        loadGame();
        showTitleScreen();

        // Handle resize
        window.addEventListener('resize', () => {
            if (canvas) {
                const container = canvas.parentElement;
                canvas.width = container.clientWidth;
                canvas.height = container.clientHeight;
            }
        });
    </script>
</body>
</html>
